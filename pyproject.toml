[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreampep"
version = "0.1.0"
description = "Traceable, target-conditioned peptide design research pipeline"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
chem = ["rdkit"]
dev = ["pytest>=8"]

[project.scripts]
dreampep = "dreampep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

